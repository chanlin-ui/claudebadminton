    <!-- 引入 SortableJS 來支援手機/桌機的順暢拖曳 -->

    <style>
        :root {
            --primary: #2c3e50;
            --accent: #27ae60;
            --bg: #f4f6f9;
            --card: #ffffff;
            --blue: #2980b9;

            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--primary);
            margin: 0;
            padding: 15px;

        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        /* 頁面切換控制 */
        .page { display: block; }
        .page.hidden { display: none; }
        
        h1 {
            text-align: center;

        }
        .grid {

            grid-template-columns: 1fr;

        .card {
            background: var(--card);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .form-group {

        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 0.9rem;
        }
        input[type="text"], select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
        }
        .gender-radio {
            margin-top: 5px;
            display: flex;
            gap: 20px;
        }
        .gender-radio label {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-weight: normal;

        }
        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;

            font-weight: bold;

        .btn-delete {

<body>

<!-- 🏠 首頁主程式 -->
<div id="homePage" class="page">
    <div class="container">
        <h1>🏸羽球雙打智慧排點｜計分板•⁼̴̶̤̀༥⁼̴̶̤́• </h1>
        
        <div class="grid">
            <div class="card">
                <h3>球員Player (點擊☰拖曳排序)</h3>
                <div class="form-group">
                    <input type="text" id="playerName" placeholder="請依球員到場順序依序輸入姓名">
                </div>
                <div class="form-group gender-radio">
                    <label><input type="radio" id="genderM" name="gender" value="男" checked> 男 ♂</label>
                    <label><input type="radio" id="genderF" name="gender" value="女"> 女 ♀</label>
                </div>
                <button onclick="addPlayer()">新增球員</button>
                <div class="player-list" id="playerList"></div>
            </div>

            <div class="card">
                <h3>⚙️ 組合設定Setting</h3>
                <div class="form-group">
                    <label for="duration">打球總時間</label>
                    <select id="duration" onchange="calculateRotation()">
                        <option value="1">1 小時 (6 場)</option>
                        <option value="1.5">1.5 小時 (9 場)</option>
                        <option value="2" selected>2 小時 (12 場)</option>
                        <option value="2.5">2.5 小時 (15 場)</option>
                        <option value="3">3 小時 (18 場)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="matchMode">組合模式選取</label>
                    <select id="matchMode" onchange="calculateRotation()">
                        <option value="mixed_clean" selected>智慧雙打組合 (平均對抗+動態調節) </option>
                        <option value="type_strict">🆕 同型強配對 (男雙/女雙/混雙依比例智慧分場)</option>
                        <option value="random">完全隨機組合</option>
                    </select>
                </div>
                <button style="background-color: #3d85c6;" onclick="calculateRotation()">🔄 重新生成對戰表</button>
            </div>
        </div>

        <div class="card">
            <h3>📊 個人場次與到場順序統計</h3>
            <div class="table-container" id="summarySection"></div>
        </div>

        <div class="card">
            <h3>📝全部對戰場次 (點擊場次開啟計分板)</h3>
            <div id="alertMsg" class="alert"></div>
            <div class="table-container" id="matchSection"></div>
        </div>
    </div>
</div>

<!-- 🧮 全螢幕即時計分板頁面 -->
<div id="scoreboardPage" class="page hidden">
    <div class="score-nav">
        <button onclick="backToHome()">⬅ 上一頁 (返回首頁)</button>
        <div id="scoreTitle" style="font-weight: bold; color: #aaa;">場次 #1</div>
        <button onclick="resetCurrentScore()" style="background:#555;">清空重計</button>
    </div>
    
    <div id="matchStatus" class="match-status-banner"></div>
    
    <div class="score-container">
        <!-- 藍隊區塊 -->
        <div class="score-box box-blue" id="boxA">
            <div class="score-names" id="namesA">藍隊</div>
            <div class="score-num" id="scoreNumA">0</div>
            <div class="swipe-hint">點擊+1 / 往下滑-1</div>
        </div>
        <!-- 紅隊區塊 -->
        <div class="score-box box-red" id="boxB">
            <div class="score-names" id="namesB">紅隊</div>
            <div class="score-num" id="scoreNumB">0</div>
            <div class="swipe-hint">點擊+1 / 往下滑-1</div>
        </div>
    </div>
    
    <div class="score-footer-btn">
        <button onclick="saveScoreAndExit()">💾 結束並記錄比分</button>
    </div>
</div>

<script>
    let players = [];
    let playerIdCounter = 1;
    let schedule = []; 
    let currentMatchIndex = null; 

    let scoreA = 0;
    let scoreB = 0;
    let isGameOver = false;
    let sortableInstance = null; // 用於儲存拖曳實例

    function loadPlayersFromStorage() {
        const savedPlayers = localStorage.getItem('badminton_players_v10');
        if (savedPlayers) {
            players = JSON.parse(savedPlayers);
            if (players.length > 0) {
                playerIdCounter = Math.max(...players.map(p => p.id)) + 1;
            }
        } else {
            const defaultNames = ["Yoyo", "沅", "Ling0", "0果", "pei"];
            const defaultGenders = ["男", "男", "男", "女", "女"];
            let baseTime = Date.now();
            players = defaultNames.map((name, index) => ({
                id: playerIdCounter++, name: name, gender: defaultGenders[index],
                arrivalTime: baseTime + index, count: 0, consecutivePlays: 0, consecutiveRests: 0
            }));
            savePlayersToStorage();
        }
    }

    function savePlayersToStorage() {
        localStorage.setItem('badminton_players_v10', JSON.stringify(players));
    }

    document.getElementById('playerName').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') addPlayer();
    });

    loadPlayersFromStorage();
    updatePlayerList();
    calculateRotation();

    function addPlayer() {
        const nameInput = document.getElementById('playerName');
        const name = nameInput.value.trim();
        if (!name) return;
        const gender = document.querySelector('input[name="gender"]:checked').value;
        
        // 給予當下最新的時間作為排隊順位
        players.push({ 
            id: playerIdCounter++, name: name, gender: gender, arrivalTime: Date.now(), 
            count: 0, consecutivePlays: 0, consecutiveRests: 0 
        });
        nameInput.value = '';
        savePlayersToStorage();
        updatePlayerList();
        calculateRotation();
    }

    function deletePlayer(id) {
        players = players.filter(p => p.id !== id);
        savePlayersToStorage();
        updatePlayerList();
        calculateRotation();
    }

    function updatePlayerList() {
        const listDiv = document.getElementById('playerList');
        listDiv.innerHTML = '';
        
        // 依照到場時間排序
        const sortedByArrival = [...players].sort((a, b) => a.arrivalTime - b.arrivalTime);
        
        sortedByArrival.forEach((p, index) => {
            const genTag = p.gender === '男' ? '<span class="tag tag-m">男</span>' : '<span class="tag tag-f">女</span>';
            // 將 data-id 綁定在 div 上供拖曳後辨識
            listDiv.innerHTML += `
                <div class="player-item" data-id="${p.id}">
                    <div class="player-info">
                        <span class="drag-handle">☰</span>
                        <span class="order-badge">${index + 1}</span>
                        <strong>${p.name}</strong>${genTag}
                    </div>
                    <button class="btn-delete" onclick="deletePlayer(${p.id})">刪除</button>
                </div>`;
        });

        // 綁定/重新綁定拖曳功能
        initSortable();
    }

    function initSortable() {
        const listDiv = document.getElementById('playerList');
        if (sortableInstance) {
            sortableInstance.destroy();
        }
        
        sortableInstance = new Sortable(listDiv, {
            handle: '.drag-handle', // 只有按住 ☰ 才能拖曳
            animation: 150,
            ghostClass: 'sortable-ghost',
            onEnd: function (evt) {
                // 拖曳結束時，根據新的 DOM 順序重新賦予 arrivalTime
                const itemEls = listDiv.querySelectorAll('.player-item');
                let newBaseTime = Date.now() - 100000; // 使用一個基準時間
                
                itemEls.forEach((el, index) => {
                    const pid = parseInt(el.getAttribute('data-id'));
                    const player = players.find(p => p.id === pid);
                    if (player) {
                        player.arrivalTime = newBaseTime + index; // 依序賦予新時間
                    }
                });
                
                savePlayersToStorage();
                updatePlayerList(); // 重新渲染以更新序號標籤 (1, 2, 3...)
                calculateRotation(); // 順序改變，立刻重算排點
            }
        });
    }

    // ========================================================================
    // 🆕【同型強配對】演算法輔助函式
    // 核心精神：條件1(總場次平均)與條件2(上場/休息間隔平均)絕對優先、不可違反，
    // 只有在「公平程度完全相同」(即 count／連休／連打三項數值完全一致) 的球員之間，
    // 才會利用這個「可自由選擇」的空間，去湊出男雙/女雙/混雙同型對抗的組合。
    // 若同一梯次(tier)裡沒有任何湊法能湊出乾淨組合，則自動退回智慧調節混搭 (符合例外情況)。
    // ========================================================================

    // 列出陣列中所有大小為 k 的組合
    function getCombinations(arr, k) {
        let result = [];
        function helper(start, combo) {
            if (combo.length === k) { result.push(combo.slice()); return; }
            for (let i = start; i < arr.length; i++) {
                combo.push(arr[i]);
                helper(i + 1, combo);
                combo.pop();
            }
        }
        helper(0, []);
        return result;
    }

    function countMen(arr) { return arr.filter(p => p.gender === '男').length; }

    // 乾淨組合定義：4男(男雙對抗) / 4女(女雙對抗) / 2男2女(混雙對抗)
    function isCleanComposition(menCount) {
        return menCount === 0 || menCount === 2 || menCount === 4;
    }

    // 依「公平優先序」把球員分成一梯一梯，同一梯內的人公平程度視為完全相同
    function buildFairnessTiers(playersList) {
        let sorted = [...playersList].sort((a, b) => {
            if (a.count !== b.count) return a.count - b.count;
            if (b.consecutiveRests !== a.consecutiveRests) return b.consecutiveRests - a.consecutiveRests;
            if (a.consecutivePlays !== b.consecutivePlays) return a.consecutivePlays - b.consecutivePlays;
            return a.arrivalTime - b.arrivalTime;
        });

        let tiers = [];
        sorted.forEach(p => {
            const key = `${p.count}_${p.consecutiveRests}_${p.consecutivePlays}`;
            const last = tiers[tiers.length - 1];
            if (last && last.key === key) {
                last.members.push(p);
            } else {
                tiers.push({ key: key, members: [p] });
            }
        });
        return tiers;
    }

    // 在「必須遵守公平順位」的前提下，挑出本場上場的 4 人，
    // 並在同一公平梯次內優先湊出乾淨的同型對抗組合
    function pickOnCourtTypeStrict(playersList) {
        const tiers = buildFairnessTiers(playersList);
        let onCourt = [];

        for (let t = 0; t < tiers.length; t++) {
            const tierMembers = tiers[t].members;
            const need = 4 - onCourt.length;
            if (need <= 0) break;

            if (tierMembers.length <= need) {
                // 這一梯全部都得上場，沒有選擇空間，直接全部納入
                onCourt.push(...tierMembers);
            } else {
                // 這一梯人數超過剩餘名額，從中挑出「最能湊成乾淨組合」的子集合
                const candidateCombos = getCombinations(tierMembers, need);
                let best = null;
                let bestScore = null;

                candidateCombos.forEach(subset => {
                    const fullGroup = onCourt.concat(subset);
                    const men = countMen(fullGroup);
                    const clean = isCleanComposition(men);
                    const arrivalSum = subset.reduce((s, p) => s + p.arrivalTime, 0);
                    // 優先乾淨組合，其次依「先來後到」做最終排序 (符合原本公平精神)
                    const score = (clean ? 0 : 1) * 1e15 + arrivalSum;
                    if (bestScore === null || score < bestScore) {
                        bestScore = score;
                        best = subset;
                    }
                });
                onCourt.push(...best);
            }
            if (onCourt.length >= 4) break;
        }
        return onCourt.slice(0, 4);
    }

    // 依上場 4 人的性別組成，決定對戰型態與分隊
    function buildMatchFromOnCourt(onCourt) {
        const men = onCourt.filter(p => p.gender === '男');
        const women = onCourt.filter(p => p.gender === '女');
        let teamA, teamB, matchTypeLabel, matchTypeClass;

        if (men.length === 4) {
            teamA = [men[0], men[3]];
            teamB = [men[1], men[2]];
            matchTypeLabel = "男雙對抗"; matchTypeClass = "type-mm";
        } else if (women.length === 4) {
            teamA = [women[0], women[3]];
            teamB = [women[1], women[2]];
            matchTypeLabel = "女雙對抗"; matchTypeClass = "type-ff";
        } else if (men.length === 2 && women.length === 2) {
            teamA = [men[0], women[0]];
            teamB = [men[1], women[1]];
            matchTypeLabel = "混雙對抗"; matchTypeClass = "type-mf";
        } else {
            // 人數/性別比無法完美湊對時的智慧調節 (例外情況)
            teamA = [onCourt[0], onCourt[3]];
            teamB = [onCourt[1], onCourt[2]];
            matchTypeLabel = "智慧調節混搭"; matchTypeClass = "type-rand";
        }
        return { teamA, teamB, matchTypeLabel, matchTypeClass };
    }

    // 🛠【核心修正】採用嚴格多層級排序，確保上場次數絕對平準 (移除舊有複雜權重)
    function calculateRotation() {
        const alertMsg = document.getElementById('alertMsg');
        const summarySection = document.getElementById('summarySection');
        
        if (players.length < 4) {
            alertMsg.innerText = "⚠️ 人數不足 4 人！";
            summarySection.innerHTML = '';
            document.getElementById('matchSection').innerHTML = '';
            return;
        } else { alertMsg.innerText = ""; }

        // 每次重新計算時，歸零所有人的狀態
        players.forEach(p => { p.count = 0; p.consecutivePlays = 0; p.consecutiveRests = 0; });
        
        const hours = parseFloat(document.getElementById('duration').value);
        const mode = document.getElementById('matchMode').value;
        const totalMatches = Math.round(hours * 60 / 10);
        schedule = []; 

        for (let m = 1; m <= totalMatches; m++) {

            let onCourt = [];
            let matchTypeLabel = "智慧混搭";
            let matchTypeClass = "type-rand";
            let teamA = [], teamB = [];

            if (mode === 'type_strict') {
                // 🆕【同型強配對】模式：
                // 1. 仍然嚴格依公平順位 (總場次→連休→連打→先來後到) 決定「誰必須上場」
                // 2. 但在公平程度完全相同的球員之間，優先湊出男雙/女雙/混雙的「同型對抗」組合
                onCourt = pickOnCourtTypeStrict(players);
                const result = buildMatchFromOnCourt(onCourt);
                teamA = result.teamA; teamB = result.teamB;
                matchTypeLabel = result.matchTypeLabel; matchTypeClass = result.matchTypeClass;

            } else {
                // 1. 嚴格排序法：確保「正負一場」的核心邏輯
                let sortedPlayers = [...players].sort((a, b) => {
                    // 第一層：總場次少的人最優先 (絕對保證正負一場)
                    if (a.count !== b.count) return a.count - b.count;
                    // 第二層：連休最久的人優先
                    if (b.consecutiveRests !== a.consecutiveRests) return b.consecutiveRests - a.consecutiveRests;
                    // 第三層：連打最少的人優先
                    if (a.consecutivePlays !== b.consecutivePlays) return a.consecutivePlays - b.consecutivePlays;
                    // 第四層：先來後到
                    return a.arrivalTime - b.arrivalTime;
                });

                // 2. 嚴格抓出「最需要上場的 4 個人」
                onCourt = sortedPlayers.slice(0, 4);

                // 3. 在這「必需上場的 4 人」內部做對戰組合分配 (絕不替換人員)
                if (mode === 'mixed_clean') {
                    let men = onCourt.filter(p => p.gender === '男');
                    let women = onCourt.filter(p => p.gender === '女');

                    if (men.length === 2 && women.length === 2) {
                        teamA = [men[0], women[0]]; // 男1 + 女1
                        teamB = [men[1], women[1]]; // 男2 + 女2
                        matchTypeLabel = "混雙對抗"; matchTypeClass = "type-mf";
                    } else if (men.length === 4) {
                        teamA = [men[0], men[3]]; 
                        teamB = [men[1], men[2]];
                        matchTypeLabel = "男雙對抗"; matchTypeClass = "type-mm";
                    } else if (women.length === 4) {
                        teamA = [women[0], women[3]]; 
                        teamB = [women[1], women[2]];
                        matchTypeLabel = "女雙對抗"; matchTypeClass = "type-ff";
                    } else {
                        // 無法湊出完美組合時，就直接拆散配對 (確保大家都有打到)
                        teamA = [onCourt[0], onCourt[3]];
                        teamB = [onCourt[1], onCourt[2]];
                    }
                } else {
                    teamA = [onCourt[0], onCourt[3]];
                    teamB = [onCourt[1], onCourt[2]];
                }
            }
            
            let activeIds = onCourt.map(x => x.id);
            let resting = [];

            // 4. 更新所有人本局結束後的狀態
            players.forEach(p => {
                if (activeIds.includes(p.id)) {
                    p.count++; 
                    p.consecutivePlays++; 
                    p.consecutiveRests = 0;
                } else {
                    p.consecutivePlays = 0; 
                    p.consecutiveRests++; 
                    resting.push(p);
                }
            });

            schedule.push({ 
                matchNum: m, 
                teamA: [{name: teamA[0].name}, {name: teamA[1].name}], 
                teamB: [{name: teamB[0].name}, {name: teamB[1].name}], 
                resting: [...resting].sort((a,b) => a.arrivalTime - b.arrivalTime), 
                label: matchTypeLabel, cssClass: matchTypeClass,
                scoreA: null, scoreB: null 
            });
        }

        // 渲染統計與對戰表
        let initialArrivalOrder = [...players].sort((a, b) => a.arrivalTime - b.arrivalTime);
        let summaryHTML = `<table><tr><th>到場順位</th><th>球員姓名</th><th>性別</th><th>當日總出賽場次</th></tr>`;
        initialArrivalOrder.forEach((p, idx) => {
            summaryHTML += `<tr><td><span class="order-badge" style="background:${idx<4?'#27ae60':'#7f8c8d'}">${idx + 1}</span></td><td>${p.name}</td><td>${p.gender}</td><td><strong>${p.count} 場</strong></td></tr>`;
        });
        summaryHTML += `</table>`;
        summarySection.innerHTML = summaryHTML;

        renderMatchTable();
    }

    function renderMatchTable() {
        const matchSection = document.getElementById('matchSection');
        let matchHTML = `<table><tr><th>場次</th><th>藍隊 </th><th>比分欄</th><th>紅隊 </th><th>休息一下 </th></tr>`;
        
        schedule.forEach((s, index) => {
            let scoreHTML = `<span class="home-score-vs home-score-empty">VS</span>`;
            let classA = "";
            let classB = "";
            
            if (s.scoreA !== null && s.scoreB !== null) {
                scoreHTML = `<span class="home-score-vs">${s.scoreA} : ${s.scoreB}</span>`;
                if (s.scoreA > s.scoreB) classA = "winner";
                if (s.scoreB > s.scoreA) classB = "winner";
            }

            matchHTML += `
                <tr>
                    <td>
                        <div class="clickable-match" onclick="openScoreboard(${index})">
                            <strong>第 ${s.matchNum} 場</strong><br>
                            <span class="match-type-tag ${s.cssClass}">${s.label}</span>
                        </div>
                    </td>
                    <td style="color: #2980b9; text-align: right; padding-right: 15px;">
                        <span class="${classA}">${s.teamA[0].name}</span><br>
                        <span class="${classA}">${s.teamA[1].name}</span>
                    </td>
                    <td>
                        ${scoreHTML}
                    </td>
                    <td style="color: #c0392b; text-align: left; padding-left: 15px;">
                        <span class="${classB}">${s.teamB[0].name}</span><br>
                        <span class="${classB}">${s.teamB[1].name}</span>
                    </td>
                    <td class="rest-list">${s.resting.map(x => `<b>${x.name}</b>`).join('<br>') || '無'}</td>
                </tr>`;
        });
        matchHTML += `</table>`;
        matchSection.innerHTML = matchHTML;
    }

    function openScoreboard(index) {
        currentMatchIndex = index;
        const match = schedule[index];
        
        document.getElementById('scoreTitle').innerText = `場次 #${match.matchNum} (${match.label})`;
        document.getElementById('namesA').innerHTML = `${match.teamA[0].name}<br>${match.teamA[1].name}`;
        document.getElementById('namesB').innerHTML = `${match.teamB[0].name}<br>${match.teamB[1].name}`;
        
        scoreA = match.scoreA !== null ? match.scoreA : 0;
        scoreB = match.scoreB !== null ? match.scoreB : 0;
        
        updateScoreUI();
        
        document.getElementById('homePage').classList.add('hidden');
        document.getElementById('scoreboardPage').classList.remove('hidden');
        document.getElementById('scoreboardPage').style.display = 'flex';
    }

    function backToHome() {
        document.getElementById('scoreboardPage').classList.add('hidden');
        document.getElementById('scoreboardPage').style.display = 'none';
        document.getElementById('homePage').classList.remove('hidden');
    }

    function resetCurrentScore() {
        if(confirm("確定要將本場分數清空重新計算嗎？")) {
            scoreA = 0;
            scoreB = 0;
            updateScoreUI();
        }
    }

    function saveScoreAndExit() {
        if (scoreA === 0 && scoreB === 0) {
            if (!confirm("目前比分為 0:0，確定要直接結束嗎？")) return;
        }
        
        schedule[currentMatchIndex].scoreA = scoreA;
        schedule[currentMatchIndex].scoreB = scoreB;
        
        renderMatchTable(); 
        backToHome();       

        if (currentMatchIndex < schedule.length - 1) {
            let nextIndex = currentMatchIndex + 1;
            setTimeout(() => {
                if(confirm(`第 ${schedule[currentMatchIndex].matchNum} 場已記錄！是否直接開啟下一場（第 ${schedule[nextIndex].matchNum} 場）的計分板？`)) {
                    openScoreboard(nextIndex);
                }
            }, 300);
        } else {
            alert("太棒了！今天的預設賽事已全部打完囉！");
        }
    }

    function updateScoreUI() {
        document.getElementById('scoreNumA').innerText = scoreA;
        document.getElementById('scoreNumB').innerText = scoreB;
        
        const statusBanner = document.getElementById('matchStatus');
        isGameOver = false;
        statusBanner.innerText = "";

        if (scoreA >= 21 || scoreB >= 21) {
            let diff = Math.abs(scoreA - scoreB);
            if (scoreA < 20 || scoreB < 20) {
                if (scoreA === 21 || scoreB === 21) {
                    isGameOver = true;
                }
            } 
            else if (scoreA >= 20 && scoreB >= 20) {
                if (diff >= 2) {
                    isGameOver = true;
                }
                if (scoreA === 30 || scoreB === 30) {
                    isGameOver = true;
                }
            }
        }

        if (isGameOver) {
            let winnerText = scoreA > scoreB ? "藍隊獲勝！" : "紅隊獲勝！";
            statusBanner.innerText = `🎉 比赛結束！${winnerText}`;
        } else if (scoreA >= 20 && scoreB >= 20) {
            statusBanner.innerText = "🔥 DEUCE 連得2分者勝！(上限30分)";
        }
    }

    function setupTouchControls(elementId, side) {
        const el = document.getElementById(elementId);
        let startY = 0;
        let isTouchEvent = false;

        el.addEventListener('touchstart', function(e) {
            startY = e.touches[0].clientY;
            isTouchEvent = true;
        }, { passive: true });

        el.addEventListener('touchend', function(e) {
            let endY = e.changedTouches[0].clientY;
            let diffY = endY - startY;

            if (diffY > 50) {
                if (side === 'A' && scoreA > 0) scoreA--;
                if (side === 'B' && scoreB > 0) scoreB--;
                updateScoreUI();
            } 
            else if (Math.abs(diffY) < 15) {
                executeAddScore(side);
            }
        }, { passive: true });

        el.addEventListener('click', function(e) {
            if (isTouchEvent) {
                isTouchEvent = false; 
                return; 
            }
            executeAddScore(side);
        });
    }

    function executeAddScore(side) {
        if (isGameOver) {
            if (!confirm("比賽已達獲勝標準，確定還要繼續加分嗎？")) return;
        }
        if (side === 'A' && scoreA < 30) scoreA++;
        if (side === 'B' && scoreB < 30) scoreB++;
        updateScoreUI();
    }

    setupTouchControls('boxA', 'A');
    setupTouchControls('boxB', 'B');
</script>
</body>
</html>
